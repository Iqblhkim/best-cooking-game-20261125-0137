<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sizzle &amp; Serve — a tiny kitchen, a lunch rush, one very busy chef</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #22303c; }
  #game {
    position: fixed; inset: 0; margin: auto;
    width: min(100vw, calc(100vh * 1280 / 720));
    height: min(100vh, calc(100vw * 720 / 1280));
    display: block; touch-action: none; cursor: pointer;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Sizzle and Serve: a cooking game. Move the chef with WASD or arrow keys, press E to use a station, serve orders before customers walk out."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
